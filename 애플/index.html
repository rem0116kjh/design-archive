t a new idea.\n\nYour notes are saved automatically in this browser.\nNo accounts. No cloud. Just you and a little possibility.\n\n— LUKA":"좋은 아이디어는 작은 생각에서 시작됩니다.\n\n떠오른 생각이나 할 일을 자유롭게 적어 보세요.\n\n메모는 현재 브라우저에 자동으로 저장됩니다.\n계정이나 서버 없이, 나의 공간에 보관합니다.\n\n— LUKA","Minimal Light":"미니멀 라이트","Premium Dark":"프리미엄 다크","macOS Inspired":"내추럴 민트","Midnight Blue":"미드나이트 블루"});

 function migrateSeedCopy(value) {

  if(value && typeof value==='object')return Object.fromEntries(Object.entries(value).map(([key,item])=>[key,['schema','storageId','id','live','source','email','github','linkedin','website','resume','photo','cover'].includes(key)?item:migrateSeedCopy(item)]));
  return value;
 }

 function validTheme(t) { return t && typeof t === 'object' && !Array.isArray(t) && colorKeys.every(k => typeof t[k] === 'string' && /^#[a-f\d]{6}$/i.test(t[k])) && Object.entries(rangeKeys).every(([k,[min,max]]) => typeof t[k] === 'number' && Number.isFinite(t[k]) && t[k] >= min && t[k] <= max) && Object.hasOwn(fonts,t.font) && typeof t.name === 'string' && t.name.length <= 80; }

 function luminance(hex) { const c = hex.slice(1).match(/../g).map(x => parseInt(x,16)/255).map(x => x <= .04045 ? x/12.92 : ((x+.055)/1.055)**2.4); return c[0]*.2126+c[1]*.7152+c[2]*.0722; }
 function applyTheme(save = true) {
  const r = document.documentElement;
  colorKeys.forEach(k => r.style.setProperty('--' + (k === 'soft' ? 'soft-accent' : k), theme[k]));
  r.style.setProperty('--on-accent',luminance(theme.accent) > .38 ? '#15231b' : '#ffffff');
  Object.keys(rangeKeys).forEach(k => r.style.setProperty('--' + (k === 'shadow' ? 'shadow-strength' : k),theme[k] + (['radius','blur'].includes(k) ? 'px' : '')));

 const BASE_PORTFOLIO = JSON.parse($('#portfolio-config').textContent);
 const textLimit = (value,max=2000) => typeof value === 'string' ? value.slice(0,max) : '';
 function safeURL(value) {if(typeof value!=='string'||!value.trim())return '';try{const url=new URL(value,location.href);return ['https:','http:','file:'].includes(url.protocol)&&!url.username&&!url.password?url.href:'';}catch{return '';}}
 function validEmail(value){return typeof value==='string'&&/^[^\s<>@]+@[^\s<>@]+\.[^\s<>@]+$/.test(value);}
 function cleanPortfolio(data){
  if(!data||data.schema!=='luka-portfolio.v1'||!data.profile||!Array.isArray(data.projects)||!Array.isArray(data.skills)||!Array.isArray(data.experience))throw Error('올바른 LUKA 포트폴리오 JSON 파일을 선택해 주세요.');
  const p={};const limits={name:60,role:120,tagline:180,headline:240,bio:6000,intro:1600,status:120,focus:200,approach:200,email:254,photo:2000000};Object.keys(BASE_PORTFOLIO.profile).forEach(k=>p[k]=textLimit(data.profile[k],limits[k]||2000));
  if(!p.name.trim())throw Error('이름을 입력해 주세요.');
  if(p.email&&!validEmail(p.email))throw Error('올바른 이메일 주소를 입력해 주세요.');
  if(p.photo&&!/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(p.photo))throw Error('프로필 사진은 PNG, JPEG, WebP 형식으로 선택해 주세요.');
  ['github','linkedin','website','resume'].forEach(k=>{if(p[k]&&!safeURL(p[k]))throw Error('Please check the '+k+' URL. Use an http, https, or local file link.');});
  return {schema:'luka-portfolio.v1',storageId:textLimit(data.storageId,100)||'starter-v1',profile:p,projects:data.projects.slice(0,30).map((project,i)=>{if(!project||typeof project!=='object')throw Error('프로젝트 항목을 확인해 주세요.');const item={};['title','category','year','role','description','challenge','approach','outcome','live','source'].forEach(k=>item[k]=textLimit(project[k],['challenge','approach','outcome'].includes(k)?6000:1000));item.id='project-'+i;item.cover=['meadow','paper','lilac'].includes(project.cover)?project.cover:'meadow';item.sample=project.sample===true;item.tags=Array.isArray(project.tags)?project.tags.filter(t=>typeof t==='string').slice(0,12).map(t=>t.slice(0,60)):[];if(!item.title.trim())throw Error('프로젝트 제목을 입력해 주세요.');['live','source'].forEach(k=>{if(item[k]&&!safeURL(item[k]))throw Error('Please check the project '+k+' link.');});return item;}),skills:data.skills.slice(0,12).map(g=>{if(!g||typeof g!=='object')throw Error('기술 분류를 확인해 주세요.');return {title:textLimit(g.title,100),icon:['code','palette','shield','spark','layers','terminal'].includes(g.icon)?g.icon:'spark',items:Array.isArray(g.items)?g.items.filter(i=>typeof i==='string').slice(0,25).map(i=>i.slice(0,80)):[]};}),experience:data.experience.slice(0,30).map(item=>{if(!item||typeof item!=='object')throw Error('경험 항목을 확인해 주세요.');return {period:textLimit(item.period,100),title:textLimit(item.title,200),organization:textLimit(item.organization,200),description:textLimit(item.description,4000),sample:item.sample===true};})};

 function runCommand(raw){const [cmd,arg]=raw.toLowerCase().split(/\s+/);if(cmd==='clear'){terminalLines=[];$('#terminal-output').replaceChildren();return;}appendTerminal('luka ~ % '+raw);const personal={about:portfolio.profile.name+' — '+portfolio.profile.role+'\n'+portfolio.profile.intro,whoami:portfolio.profile.name+'\n'+portfolio.profile.bio,skills:portfolio.skills.map(g=>g.title+': '+g.items.join(', ')).join('\n'),projects:portfolio.projects.map(p=>p.title+(p.sample?' [예시]':'')+'\n  '+p.description).join('\n\n'),experience:portfolio.experience.map(item=>item.period+' — '+item.title+(item.sample?' [예시]':'')+'\n'+item.organization+'\n'+item.description).join('\n\n'),contact:[portfolio.profile.email,portfolio.profile.github,portfolio.profile.linkedin,portfolio.profile.website].filter(Boolean).join('\n')||'연락처가 아직 없습니다. 편집하기 → 연락처에서 내용을 입력해 주세요.'};if(Object.hasOwn(personal,cmd)){appendTerminal(personal[cmd]);return;}const outputs={help:'사용할 수 있는 명령어:\n\n  about       프로젝트 소개\n  whoami      프로필 소개\n  skills      사용 기술\n  projects    프로젝트 목록\n  experience  경험과 활동\n  contact     연락처\n  theme       theme light | dark | mint | blue\n  date        현재 날짜와 시간\n  clear       화면 지우기\n\nTab 자동완성 · ↑ / ↓ 이전 명령어',about:'LUKA Portfolio 1.0\nDesigned with clarity. Built with precision.\nA design system and interactive desktop, in a single HTML file.',whoami:'LUKA — creator of this interface.\nExploring frontend engineering, UI systems, and thoughtful interactions.',skills:'Semantic HTML · Responsive CSS · Vanilla JavaScript\nCSS design tokens · Pointer Events · Local storage\nKeyboard interaction · Reduced motion · Theme export',projects:'LUKA UI\n  • 7 interactive desktop apps\n  • Reusable component playground\n  • Live theme studio with CSS / JSON / Tailwind export\n\n작업실 열기 → 나의 프로젝트 to read the case study.',experience:'Engineering choices:\n  Shared window manager → predictable stacking and focus.\n  App-local content → independent working applications.\n  Browser storage → private, offline persistence.\n  CSS tokens → one edit, reflected everywhere.\n\nCareer history has not been supplied.',contact:'Contact details have not been supplied.\nAdd your verified email or portfolio URL before publishing.',date:new Date().toLocaleString('ko-KR')};if(cmd==='theme'){if(arg && presets[arg]){selectPreset(arg);appendTerminal('적용한 테마: '+presets[arg].name);}else appendTerminal('현재 테마: '+theme.name+'\n사용법: theme light | dark | mint | blue');return;}appendTerminal(outputs[cmd]||'알 수 없는 명령어: '+raw+'\nhelp를 입력하면 명령어를 볼 수 있습니다.');}

 function renderSettings(root){root.innerHTML=`<div class="settings-app"><h3>나에게 편안한 작업실</h3><p>작은 디테일까지 조정해 보세요. 설정은 자동으로 저장됩니다.</p><div class="setting-row"><label for="settings-appearance">화면 스타일<small>편안한 화면을 선택하세요.</small></label><select id="settings-appearance" data-setting-theme><option value="mint">내추럴 민트</option><option value="light">미니멀 라이트</option><option value="dark">프리미엄 다크</option><option value="blue">미드나이트 블루</option><option value="custom" disabled>사용자 테마</option></select></div><div class="setting-row"><span>배경화면</span>${wallpaperButtons()}</div><div class="setting-row"><label for="settings-accent">강조 색상</label><input id="settings-accent" type="color" value="${theme.accent}" data-theme-key="accent"></div><div class="setting-row"><label for="settings-font">글꼴</label><select id="settings-font" data-theme-key="font"><option value="system">시스템 고딕</option><option value="serif">명조</option><option value="mono">고정폭</option></select></div>${[['wallpaperMotion','움직이는 배경','물결 배경이 서로 다른 속도로 부드럽게 흐릅니다.'],['motion','화면 동작','자연스러운 화면 전환을 사용합니다.'],['contrast','고대비','글자와 경계선을 더 또렷하게 표시합니다.'],['transparency','반투명 효과','메뉴와 Dock에 반투명 효과를 적용합니다.'],['icons','데스크톱 아이콘','프로젝트와 소개에 빠르게 접근합니다.'],['dock','넉넉한 Dock','앱 아이콘 사이에 여유를 둡니다.']].map(([key,title,sub])=>`<div class="setting-row"><label for="pref-${key}">${title}<small>${sub}</small></label><input id="pref-${key}" type="checkbox" class="toggle" data-pref="${key}" ${prefs[key]?'checked':''}></div>`).join('')}<div class="setting-row"><span>테마의 모든 디테일을 바꿔 보세요.</span><button class="btn secondary" data-app="theme" style="font-size:10px;padding:7px 12px">테마 편집기 열기 ${icon('arrow')}</button></div></div>`;const preset=Object.keys(presets).find(k=>presets[k].name===theme.name);$('#settings-appearance',root).value=preset||'custom';applyTheme(false);applyPrefs(false);}

 function initPlayground(root){const el=$('[data-playground]',root)||root;const id=el.dataset.playground;let state=playgrounds.get(id)||{component:'Button',size:'medium',variant:'primary',disabled:false,loading:false,icon:true,radius:24,color:null,viewport:'desktop',slide:0};playgrounds.set(id,state);

 function buttonHTML(options={}){const {variant='primary',label='멋진 작업 시작하기',disabled=false,loading=false,showIcon=true,size='medium',radius=24,color=null}=options;const pad={small:'8px 14px',medium:'12px 21px',large:'16px 28px'}[size];return `<button class="btn ${variant==='primary'?'':variant}" style="padding:${pad};border-radius:${Number(radius)}px;${color?'--accent:'+color+';--button-bg:'+color+';--on-accent:'+(luminance(color)>.38?'#15231b':'#ffffff')+';':''}" ${disabled||loading?'disabled':''} ${loading?'aria-busy="true"':''} data-action="sample">${loading?'<span class="spinner" aria-hidden="true"></span>':''}${loading?'준비하고 있어요…':esc(label)}${showIcon&&!loading?icon('arrow'):''}</button>`;}

  const reduced=matchMedia('(prefers-reduced-motion: reduce)');
  const fine=matchMedia('(hover: hover) and (pointer: fine)'),small=matchMedia('(max-width:767px)');
  const canMorph=typeof svg.pauseAnimations==='function'&&typeof svg.unpauseAnimations==='function';
  const curves=$$('.wave-layer',svg).map(node=>({node,base:node.getAttribute('d'),layer:Number([...node.classList].find(c=>/^wave-\d$/.test(c)).slice(-1))}));
  let touch=null,animations=[],scale=1,enabled=false,printing=false,frame=0,lastTime=0;
  let bounds=desktop.getBoundingClientRect(),current={x:0,y:0},target={x:0,y:0};
  const measure=()=>{bounds=desktop.getBoundingClientRect();};
  const writePointer=()=>{surface.style.transform=`translate3d(${current.x.toFixed(3)}px,${current.y.toFixed(3)}px,0)`;};
  function stopPointer(){cancelAnimationFrame(frame);frame=0;lastTime=0;current={x:0,y:0};target={x:0,y:0};writePointer();}
  function stepPointer(now){
   frame=0;if(!enabled||touch){stopPointer();return;}
   const elapsed=lastTime?(now-lastTime)/1000:1/60;lastTime=now;
   current=followWallpaperPointer(current,target,elapsed);writePointer();
   if(Math.hypot(target.x-current.x,target.y-current.y)>WALLPAPER_MOTION.pointerRest)frame=requestAnimationFrame(stepPointer);
   else{current={...target};writePointer();lastTime=0;}
  }
  function schedulePointer(){if(!frame&&enabled&&!touch)frame=requestAnimationFrame(stepPointer);}
  function centerPointer(){target={x:0,y:0};schedulePointer();}
  function buildCurves(){
   if(!canMorph)return;
   const clock=svg.getCurrentTime();svg.pauseAnimations();
   animations.forEach(a=>a.node.remove());animations=[];
   const samples=touch?WALLPAPER_MOTION.touchSamples:WALLPAPER_MOTION.desktopSamples;
   const strength=touch?WALLPAPER_MOTION.touchAmplitude:1;
   curves.forEach(curve=>{
    const spec=WALLPAPER_MOTION.curves[curve.layer],values=[];
    for(let i=0;i<samples;i++)values.push(sampleWallpaperCurve(curve.base,i/samples*Math.PI*2,spec.amplitude*strength,spec.phase));
    values.push(values[0]); // Exact endpoint equality makes the repeated path loop seamless.
    curve.node.setAttribute('d',values[0]);
    const animation=document.createElementNS('http://www.w3.org/2000/svg','animate');
    animation.setAttribute('attributeName','d');animation.setAttribute('values',values.join(';'));
    animation.setAttribute('dur',spec.seconds*scale+'s');animation.setAttribute('repeatCount','indefinite');
    animation.setAttribute('calcMode','linear');animation.setAttribute('begin','0s');
    curve.node.append(animation);animations.push({node:animation,seconds:spec.seconds});
   });
   svg.setCurrentTime(clock);svg.dataset.motionSamples=String(samples);
  }
  function updateDuration(){
   const next=theme.speed*(touch?WALLPAPER_MOTION.touchDuration:1);
   if(next===scale)return;
   if(canMorph){const clock=svg.getCurrentTime();animations.forEach(a=>a.node.setAttribute('dur',a.seconds*next+'s'));svg.setCurrentTime(clock*next/scale);}
   scale=next;
  }
  function syncWindows(){
   // Full-screen mobile apps cover the wallpaper. Pause its paint work without resetting SVG time.
   const foreground=small.matches&&active&&windows.has(active)&&!windows.get(active).minimized;
   enabled=Boolean(prefs.motion&&prefs.wallpaperMotion&&!reduced.matches&&!document.hidden&&!printing&&!document.body.classList.contains('reading-mode')&&!foreground);
   if(canMorph){if(enabled)svg.unpauseAnimations();else svg.pauseAnimations();}
   if(!enabled||touch)stopPointer();
   svg.dataset.motionState=enabled?'running':'paused';svg.dataset.pointerMotion=enabled&&!touch?'enabled':'disabled';
   svg.dataset.motionOccluded=foreground?'true':'false';
  }
  function sync(){
   const nextTouch=small.matches||!fine.matches;
   if(nextTouch!==touch){touch=nextTouch;stopPointer();buildCurves();}
   updateDuration();measure();syncWindows();
  }
  desktop.addEventListener('pointermove',event=>{
   if(!enabled||touch||event.pointerType==='touch'||event.buttons||bounds.width<=0||bounds.height<=0)return;
   const x=Math.max(-1,Math.min(1,(event.clientX-bounds.left)/bounds.width*2-1));
   const y=Math.max(-1,Math.min(1,(event.clientY-bounds.top)/bounds.height*2-1));
   target={x:x*WALLPAPER_MOTION.pointerX,y:y*WALLPAPER_MOTION.pointerY};schedulePointer();
  },{passive:true});
  desktop.addEventListener('pointerleave',centerPointer,{passive:true});
  desktop.addEventListener('pointercancel',centerPointer,{passive:true});
  window.addEventListener('blur',centerPointer);
  window.addEventListener('resize',sync,{passive:true});
  if(typeof ResizeObserver!=='undefined'){const observer=new ResizeObserver(measure);observer.observe(desktop);}
  [reduced,fine,small].forEach(query=>{if(query.addEventListener)query.addEventListener('change',sync);else query.addListener(sync);});
  window.addEventListener('beforeprint',()=>{printing=true;sync();});
  window.addEventListener('afterprint',()=>{printing=false;sync();});
  sync();return {sync,syncWindows};
 }
 wallpaperMotionController=createWallpaperMotion();
 let resizeFrame;window.addEventListener('resize',()=>{cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(clampWindows);});
 applyTheme(false);applyPrefs(false);tick();setInterval(tick,15000);renderPortfolioShell();if(!mobile())openApp('files');else $('#active-app').textContent='포트폴리오';
 $$('svg.ico:not([aria-label])').forEach(svg=>svg.setAttribute('aria-hidden','true'));
})();
</script>
</body>
